# Publica a Sprint 04 da Iara Games no GitHub Pages a cada push na main.
# O site final é montado assim:
#   /                -> redireciona para a página inicial
#   /HTML, /CSS ...  -> páginas da plataforma (HTML, CSS e JS da Sprint 02)
#   /catalogo/       -> área de Catálogo em React (Fase 06)
#   /estudios/       -> área de Estúdios em React com a API ViaCEP (Fase 07)
name: Deploy da Sprint 04

on:
  push:
    branches: [main]
    paths:
      - "sprint-04/**"
      - ".github/workflows/deploy-react.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências das áreas React
        working-directory: sprint-04/React
        run: npm install

      - name: Gerar build das áreas React (Catálogo e Estúdios)
        working-directory: sprint-04/React
        run: npm run build

      - name: Montar o site completo
        run: |
          mkdir -p _site
          cp -r sprint-04/index.html sprint-04/Assets sprint-04/CSS sprint-04/HTML sprint-04/JS _site/
          # o build já vem com as pastas catalogo/, estudios/ e react-assets/
          cp -r sprint-04/React/dist/. _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
