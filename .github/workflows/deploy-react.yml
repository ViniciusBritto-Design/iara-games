# Publica a Sprint 03 da Iara Games no GitHub Pages a cada push na main.
# O site final é montado assim:
#   /                -> redireciona para a página inicial
#   /HTML, /CSS ...  -> páginas da plataforma (HTML, CSS e JS da Sprint 02)
#   /catalogo/       -> área de Catálogo desenvolvida em React (pasta React)
name: Deploy da Sprint 03

on:
  push:
    branches: [main]
    paths:
      - "sprint-03/**"
      - ".github/workflows/deploy-react.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do Catálogo React
        working-directory: sprint-03/React
        run: npm install

      - name: Gerar build do Catálogo React
        working-directory: sprint-03/React
        run: npm run build

      - name: Montar o site completo
        run: |
          mkdir -p _site/catalogo
          cp -r sprint-03/index.html sprint-03/Assets sprint-03/CSS sprint-03/HTML sprint-03/JS _site/
          cp -r sprint-03/React/dist/. _site/catalogo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
